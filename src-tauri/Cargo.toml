[package]
name = "streamlabs-tiktok-stream-key-generator"
version = "2.1.0"
description = "TikTok Live Stream Key Generator for OBS Studio using the Streamlabs API"
authors = ["Loukious (original Python) — Tauri rebuild"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stream_key_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
regex = "1"
dirs = "5"
semver = "1"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
